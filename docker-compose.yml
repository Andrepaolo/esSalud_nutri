version: '3.8'

services:
  app:
    build: .
    container_name: laravel_app
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html:delegated
    depends_on:
      - db
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: minsadb
      DB_USERNAME: root
      DB_PASSWORD: ap123$
    networks:
      - mynetwork

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: minsadb
      MYSQL_ROOT_PASSWORD: ap123$
      MYSQL_PASSWORD: ap123$
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - mynetwork

volumes:
  dbdata:

networks:
  mynetwork:
    driver: bridge
